<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Project Status</title>
<style>
:root{--bg:#eef2f3;--card:#fff;--ink:#16272c;--mute:#5d7077;--line:#d3dde0;--brand:#1f5f6b;--brass:#b07d22;--ok:#2e7d5b}
@media(prefers-color-scheme:dark){:root{--bg:#10191c;--card:#182428;--ink:#e6eef0;--mute:#93a6ac;--line:#2b3b40;--brand:#5fb3c2;--brass:#e0a840;--ok:#5fc796}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
main{max-width:520px;margin:0 auto}
h1{font:600 26px/1.2 Georgia,serif;margin:12px 0 4px}
p.sub{color:var(--mute);margin:0 0 20px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button.go{margin-top:14px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--brass);color:#fff;font:600 16px inherit;font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.steps{list-style:none;margin:16px 0 0;padding:0}
.steps li{position:relative;padding:0 0 18px 34px;color:var(--mute)}
.steps li::before{content:"";position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.steps li::after{content:"";position:absolute;left:8px;top:22px;bottom:-2px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--ok);border-color:var(--ok)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now::before{background:var(--brass);border-color:var(--brass)}
.note{border-left:3px solid var(--brass);padding:6px 12px;margin-top:6px;color:var(--ink);background:var(--bg);border-radius:0 8px 8px 0}
.meta{font-size:13px;color:var(--mute);margin-top:10px}
.err{color:#c0392b;margin-top:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.code{font-family:Consolas,monospace;background:var(--bg);padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Website project status</h1>
<p class="sub">Track your website from first call to launch.</p>

<div class="tabs hide" id="tabs" role="tablist">
  <button role="tab" id="t1" aria-selected="true">Customer</button>
  <button role="tab" id="t2" aria-selected="false">Admin</button>
</div>

<!-- Customer -->
<section id="customer">
  <div class="card">
    <label for="code">Your project code</label>
    <input id="code" placeholder="e.g. HX7K29" autocapitalize="characters">
    <button class="go" id="check">Check status</button>
    <div class="err" id="cerr"></div>
  </div>
  <div class="card hide" id="result"></div>
</section>

<!-- Admin -->
<section id="admin" class="hide">
  <div class="card" id="login">
    <label for="pw">Admin password</label>
    <input id="pw" type="password">
    <button class="go" id="loginBtn">Log in</button>
    <div class="err" id="aerr"></div>
  </div>
  <div class="hide" id="panel">
    <div class="card">
      <label for="cname">New project: customer name</label>
      <input id="cname" placeholder="Hotel Sunrise">
      <button class="go" id="add">Add project</button>
    </div>
    <div id="list"></div>
  </div>
</section>
</main>

<script>
const STAGES=["Requirement","Design","Development","Testing","Live"];
const ADMIN_PW="admin123"; // demo only: real login must be checked on the PHP server
let db=[];
try{db=JSON.parse(localStorage.getItem("projects")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("projects",JSON.stringify(db))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>new Date(t).toLocaleString();

function tab(n){
  $("customer").classList.toggle("hide",n!==1);
  $("admin").classList.toggle("hide",n!==2);
  $("t1").setAttribute("aria-selected",n===1);
  $("t2").setAttribute("aria-selected",n===2);
}
function checkHash(){
  const isAdmin=location.hash==="#admin";
  $("tabs").classList.toggle("hide",!isAdmin);
  tab(isAdmin?2:1);
}
window.addEventListener("hashchange",checkHash);
checkHash();
$("t1").onclick=()=>tab(1);
$("t2").onclick=()=>tab(2);

function steps(p){
  const i=STAGES.indexOf(p.status);
  return '<ol class="steps">'+STAGES.map((s,k)=>
    `<li class="${k<i||p.status==="Live"?"done":k===i?"now":""}">${s}</li>`).join("")+"</ol>";
}

$("check").onclick=()=>{
  const c=$("code").value.trim().toUpperCase();
  const p=db.find(x=>x.code===c);
  $("cerr").textContent="";
  $("result").classList.add("hide");
  if(!p){$("cerr").textContent="No project found for that code. Check it and try again.";return}
  $("result").innerHTML=`<div class="row"><strong>${esc(p.name)}</strong><span class="code">${esc(p.code)}</span></div>`+
    steps(p)+(p.note?`<div class="note">${esc(p.note)}</div>`:"")+
    `<div class="meta">Last updated ${fmt(p.updated)}</div>`;
  $("result").classList.remove("hide");
};

$("loginBtn").onclick=()=>{
  if($("pw").value===ADMIN_PW){$("login").classList.add("hide");$("panel").classList.remove("hide");render()}
  else $("aerr").textContent="Wrong password.";
};

$("add").onclick=()=>{
  const n=$("cname").value.trim();
  if(!n)return;
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code="";for(let i=0;i<6;i++)code+=chars[Math.floor(Math.random()*chars.length)];
  db.push({name:n,code,status:STAGES[0],note:"",updated:Date.now()});
  save();$("cname").value="";render();
};

function render(){
  $("list").innerHTML=db.length?db.map((p,i)=>`
    <div class="card">
      <div class="row"><strong>${esc(p.name)}</strong><span class="code">${esc(p.code)}</span></div>
      <label for="s${i}">Status</label>
      <select id="s${i}">${STAGES.map(s=>`<option${s===p.status?" selected":""}>${s}</option>`).join("")}</select>
      <label for="n${i}">Note for customer</label>
      <textarea id="n${i}" rows="2">${esc(p.note)}</textarea>
      <button class="go" data-i="${i}">Update status</button>
      <div class="meta">Last updated ${fmt(p.updated)}</div>
    </div>`).join(""):'<div class="card">No projects yet. Add your first customer above.</div>';
  document.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    db[i].status=$("s"+i).value;db[i].note=$("n"+i).value.trim();db[i].updated=Date.now();
    save();render();
  });
}
</script>
</body>
</html>
